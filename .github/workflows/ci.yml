name: Build

on:
  push:
    paths-ignore:
      - coverage-badge.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Cache CMake dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2 2>&1 | tee build.log

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log-${{ matrix.os }}
          path: build.log

  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy libcurl4-openssl-dev

      - name: Cache CMake dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/_deps
          key: ubuntu-${{ runner.arch }}-cmake-quality-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2 2>&1 | tee build.log

      - name: Check formatting
        run: cmake --build build --target format-check

      - name: Run clang-tidy
        run: cmake --build build --target tidy

      - name: Upload quality log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-log
          path: build.log

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Cache CMake dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build-sanitize/_deps
          key: ubuntu-${{ runner.arch }}-cmake-sanitize-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DSAS_TUI_ENABLE_ASAN=ON -DSAS_TUI_ENABLE_UBSAN=ON

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2 2>&1 | tee sanitizer.log

      - name: Run tests
        run: ctest --test-dir build-sanitize --output-on-failure

      - name: Upload sanitizer log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizer-log
          path: sanitizer.log

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr libcurl4-openssl-dev

      - name: Configure
        run: >-
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug
          -DSAS_TUI_ENABLE_COVERAGE=ON

      - name: Generate coverage report
        run: cmake --build build-coverage --target coverage

      - name: Generate coverage badge data
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          root = ET.parse("build-coverage/coverage.xml").getroot()
          percentage = float(root.attrib["line-rate"]) * 100
          if percentage >= 80:
              color = "brightgreen"
          elif percentage >= 60:
              color = "yellow"
          else:
              color = "red"
          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{percentage:.1f}%",
              "color": color,
          }
          with open("coverage-badge.json", "w", encoding="utf-8") as output:
              json.dump(badge, output, indent=2)
              output.write("\n")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: build-coverage/coverage.xml

      - name: Upload coverage badge data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-badge-data
          path: coverage-badge.json

  publish-coverage-badge:
    name: Publish Coverage Badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download coverage badge data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-badge-data
          path: badge-data

      - name: Publish coverage badge
        run: |
          set -euo pipefail
          cp badge-data/coverage-badge.json /tmp/coverage-badge.json
          git fetch origin coverage:coverage || true
          if git show-ref --verify --quiet refs/remotes/origin/coverage; then
            git switch --track -c coverage origin/coverage
          else
            git switch --orphan coverage
          fi
          git rm -rf . --ignore-unmatch
          cp /tmp/coverage-badge.json coverage-badge.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-badge.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update coverage badge"
          git push origin HEAD:coverage
