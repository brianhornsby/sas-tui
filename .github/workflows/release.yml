name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Cache CMake dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-release-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ARCH" == "X64" ]]; then
            platform="linux-x86_64"
          elif [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "ARM64" ]]; then
            platform="macos-arm64"
          elif [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "X64" ]]; then
            platform="macos-x86_64"
          else
            platform="${RUNNER_OS,,}-${RUNNER_ARCH,,}"
          fi
          package="sas-tui-${platform}"
          mkdir -p "release/${package}"
          cp build/sas-tui "release/${package}/"
          cp LICENSE README.md "release/${package}/"
          tar -czf "release/${package}.tar.gz" -C release "${package}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "release/${package}.tar.gz" > "release/${package}.tar.gz.sha256"
          else
            shasum -a 256 "release/${package}.tar.gz" > "release/${package}.tar.gz.sha256"
          fi
          rm -rf "release/${package}"

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release/*
          --repo "${{ github.repository }}"
          --title "sas-tui ${{ github.ref_name }}"
          --generate-notes
